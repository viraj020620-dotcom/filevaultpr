<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileVault Pro Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 28, 45, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --gold-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --green-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-admin { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .badge-vip { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .badge-user { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    .badge-locked { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .input-box {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      margin: 6px 0 10px;
      outline: none;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      font-size: 11px;
      padding: 8px;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      margin: 8px 0;
    }
    .stat-item span { color: var(--muted); display: block; font-size: 9px; text-transform: uppercase; }
    .stat-item b { font-size: 12px; color: #fff; word-break: break-all; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-top: 6px;
    }
    .btn-primary { background: var(--accent-grad); color: #fff; }
    .btn-gold { background: var(--gold-grad); color: #fff; }
    .btn-green { background: var(--green-grad); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--muted); }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ FILEVAULT DASHBOARD</h1>
    <p>Official File Manager for @FILETOLINKSPRBOT</p>
  </div>

  <div class="badge-bar">
    <span id="roleBadge" class="badge">Checking Access...</span>
    <span id="summaryCount" style="font-size: 12px; color: var(--muted);"></span>
  </div>

  <div id="mainContainer"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const ADMIN_ID = 5227795354;
    const tgUser = tg?.initDataUnsafe?.user || { id: ADMIN_ID, username: "MRINFERNAL" };

    // Read payload injected by Bot
    const urlParams = new URLSearchParams(window.location.search);
    const uRole = urlParams.get("role") || (Number(tgUser.id) === ADMIN_ID ? "admin" : "locked");
    const uStatus = urlParams.get("status") || "Free User";
    
    let items = [];
    try {
      const rawData = urlParams.get("items");
      if (rawData) items = JSON.parse(decodeURIComponent(rawData));
    } catch (e) {
      console.error(e);
    }

    const roleBadge = document.getElementById("roleBadge");
    const summaryCount = document.getElementById("summaryCount");
    const container = document.getElementById("mainContainer");

    // 1. ADMIN VIEW (ALL FILES & GLOBAL CONTROLS)
    if (uRole === "admin" || Number(tgUser.id) === ADMIN_ID) {
      roleBadge.innerText = "👑 Master Admin";
      roleBadge.className = "badge badge-admin";
      summaryCount.innerText = `Total Links: ${items.length}`;

      let adminControls = `
        <div class="card">
          <h3 style="font-size: 14px; margin-bottom: 4px; color: var(--accent);">👑 Quick User Grant Panel</h3>
          <input type="number" id="targetUserId" class="input-box" placeholder="Target Telegram User ID">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
            <button onclick="sendAction('unlock_web')" class="btn btn-green">🔓 Unlock Web (₹5)</button>
            <button onclick="sendAction('grant_vip')" class="btn btn-gold">💎 Grant VIP (₹100)</button>
          </div>
        </div>
      `;

      let cards = items.map(item => `
        <div class="card">
          <div style="display:flex; justify-content:space-between;">
            <b style="font-size:13px;">📦 ${escapeHtml(item.t || 'Untitled')}</b>
            <span class="badge ${item.p ? 'badge-vip' : 'badge-user'}">${item.p ? 'PERMANENT' : 'EXPIRING'}</span>
          </div>

          <div class="stats-row">
            <div class="stat-item"><span>Owner ID</span><b>${item.u}</b></div>
            <div class="stat-item"><span>Plain Password</span><b>${item.k ? '🔑 ' + escapeHtml(item.k) : '🔓 None'}</b></div>
            <div class="stat-item"><span>Views</span><b>👁️ ${item.v || 0}</b></div>
            <div class="stat-item"><span>Files Count</span><b>📁 ${item.c || 1} file(s)</b></div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px; margin-top:6px;">
            <a href="https://t.me/FILETOLINKSPRBOT?start=${item.i}" class="btn btn-primary" target="_blank">🔗 Open</a>
            <button onclick="sendAction('set_permanent', '${item.i}')" class="btn btn-gold">♾️ Lock</button>
            <button onclick="sendAction('delete_link', '${item.i}')" class="btn btn-danger">🗑️ Delete</button>
          </div>
        </div>
      `).join('');

      container.innerHTML = adminControls + (cards || `<div class="card" style="text-align:center; color:var(--muted);">No uploads found in system.</div>`);
    }

    // 2. UNLOCKED NORMAL USER (VIEW & MANAGE OWN UPLOADS)
    else if (uRole === "unlocked" || uRole === "vip") {
      roleBadge.innerText = uRole === "vip" ? "⭐ VIP Member" : "Active User";
      roleBadge.className = uRole === "vip" ? "badge badge-vip" : "badge badge-user";
      summaryCount.innerText = `My Uploads: ${items.length}`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding: 20px;">
            <p style="font-size:13px; color:var(--muted);">You haven't generated any active links yet.</p>
            <p style="font-size:12px; color:var(--accent); margin-top:6px;">Send files in the bot chat to create a link!</p>
          </div>
        `;
      } else {
        container.innerHTML = items.map(item => `
          <div class="card">
            <div style="display:flex; justify-content:space-between;">
              <b style="font-size:13px;">📦 ${escapeHtml(item.t || 'Untitled')}</b>
              <span class="badge ${item.p ? 'badge-vip' : 'badge-user'}">${item.p ? 'Permanent' : 'Expiring'}</span>
            </div>

            <div class="stats-row">
              <div class="stat-item"><span>Active Password</span><b>${item.k ? '🔑 ' + escapeHtml(item.k) : '🔓 Public'}</b></div>
              <div class="stat-item"><span>Total Views</span><b>👁️ ${item.v || 0}</b></div>
              <div class="stat-item"><span>Files Attached</span><b>📁 ${item.c || 1} file(s)</b></div>
              <div class="stat-item"><span>Link ID</span><b><code>${item.i}</code></b></div>
            </div>

            <div style="background:rgba(0,0,0,0.2); padding:8px; border-radius:8px; margin-top:6px;">
              <div style="display:flex; gap:4px;">
                <input type="text" id="n_${item.i}" class="input-box" style="margin:0;" placeholder="New Title" value="${escapeHtml(item.t || '')}">
                <input type="text" id="p_${item.i}" class="input-box" style="margin:0;" placeholder="New Password" value="${escapeHtml(item.k || '')}">
              </div>
              <button onclick="updateDetails('${item.i}')" class="btn btn-primary" style="margin-top:6px;">💾 Save Details</button>
            </div>

            <div style="display:flex; gap:6px; margin-top:6px;">
              <a href="https://t.me/FILETOLINKSPRBOT?start=${item.i}" class="btn btn-secondary" target="_blank">🔗 Test Link</a>
              <button onclick="sendAction('delete_link', '${item.i}')" class="btn btn-danger">🗑️ Delete</button>
            </div>
          </div>
        `).join('');
      }
    }

    // 3. LOCKED USER VIEW
    else {
      roleBadge.innerText = "🔒 Access Locked";
      roleBadge.className = "badge badge-locked";

      container.innerHTML = `
        <div class="card">
          <h3 style="font-size: 16px; margin-bottom: 6px;">🚀 Web App Pro Privileges</h3>
          <p style="font-size: 12px; color: var(--muted);">Unlock your personal cloud manager.</p>

          <ul style="list-style:none; margin:14px 0; font-size:12px;">
            <li style="margin-bottom:6px;">📊 <b>Live View Counts:</b> Real-time visitor tracking</li>
            <li style="margin-bottom:6px;">🔑 <b>Password Changing:</b> Change security on live links</li>
            <li style="margin-bottom:6px;">🗑️ <b>1-Click Deletion:</b> Instantly delete files</li>
            <li style="margin-bottom:6px;">⚡ <b>Zero Waiting:</b> Priority link generator</li>
          </ul>

          <div style="background:rgba(56,189,248,0.08); border:1px dashed var(--accent); border-radius:10px; padding:10px; text-align:center; margin:10px 0;">
            <span style="font-size:10px; color:var(--muted); text-transform:uppercase;">Lifetime Access</span>
            <div style="font-size:18px; font-weight:bold;">₹5 Only</div>
          </div>

          <button onclick="requestAccess()" class="btn btn-gold">💳 Pay ₹5 & Grant Access</button>
          <button onclick="closeApp()" class="btn btn-secondary">Back to Bot Chat</button>
        </div>
      `;
    }

    function sendAction(actionType, linkId = "") {
      let targetId = document.getElementById("targetUserId") ? document.getElementById("targetUserId").value.trim() : "";
      if (tg) {
        tg.sendData(JSON.stringify({ action: actionType, target_id: targetId, link_id: linkId }));
        tg.close();
      }
    }

    function updateDetails(id) {
      let n = document.getElementById(`n_${id}`).value.trim();
      let p = document.getElementById(`p_${id}`).value.trim();
      if (tg) {
        tg.sendData(JSON.stringify({ action: "update_link", link_id: id, nickname: n, password: p }));
        tg.close();
      }
    }

    function requestAccess() {
      const uId = tgUser.id || "Unknown";
      const uName = tgUser.username ? `@${tgUser.username}` : "No Username";
      const msg = encodeURIComponent(`Hey @MRINFERNAL,\nI want to buy Permanent Web App Access for ₹5!\n👤 User: ${uName}\n🆔 ID: ${uId}`);
      window.open(`https://t.me/MRINFERNAL?text=${msg}`, '_blank');
    }

    function closeApp() {
      if (tg) tg.close();
      else window.close();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
