<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileVault Cloud Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 28, 45, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --gold-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --green-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 60px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-admin { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .badge-vip { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .badge-user { background: rgba(56, 189, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .input-box {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      margin: 6px 0 10px;
      outline: none;
    }
    .input-box:focus { border-color: var(--accent); }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      font-size: 11px;
      padding: 8px;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      margin: 8px 0;
    }
    .stat-item span { color: var(--muted); display: block; font-size: 9px; text-transform: uppercase; }
    .stat-item b { font-size: 12px; color: #fff; word-break: break-all; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-top: 6px;
    }
    .btn-primary { background: var(--accent-grad); color: #fff; }
    .btn-gold { background: var(--gold-grad); color: #fff; }
    .btn-green { background: var(--green-grad); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--muted); }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ FILEVAULT CLOUD MANAGER</h1>
    <p>Official Web App • Bot by @MRINFERNAL</p>
  </div>

  <div class="badge-bar">
    <span id="roleBadge" class="badge">Connecting...</span>
    <span id="summaryCount" style="font-size: 12px; color: var(--muted);"></span>
  </div>

  <div id="mainContainer"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const ADMIN_ID = 5227795354;
    const tgUser = tg?.initDataUnsafe?.user || { id: ADMIN_ID, username: "MRINFERNAL" };

    const urlParams = new URLSearchParams(window.location.search);
    const uRole = urlParams.get("role") || (Number(tgUser.id) === ADMIN_ID ? "admin" : "user");
    
    let items = [];
    try {
      const rawData = urlParams.get("items");
      if (rawData) items = JSON.parse(decodeURIComponent(rawData));
    } catch (e) {
      console.error(e);
    }

    const roleBadge = document.getElementById("roleBadge");
    const summaryCount = document.getElementById("summaryCount");
    const container = document.getElementById("mainContainer");

    // 1. ADMIN DASHBOARD (GLOBAL MANAGEMENT & ALL USER FILES)
    if (uRole === "admin" || Number(tgUser.id) === ADMIN_ID) {
      roleBadge.innerText = "👑 Master Admin";
      roleBadge.className = "badge badge-admin";
      summaryCount.innerText = `Total Links: ${items.length}`;

      let adminControls = `
        <div class="card">
          <h3 style="font-size: 14px; margin-bottom: 4px; color: var(--accent);">👑 Quick Admin Grant Panel</h3>
          <input type="number" id="targetUserId" class="input-box" placeholder="Target Telegram User ID">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
            <button onclick="sendAction('grant_vip')" class="btn btn-gold">💎 Grant VIP (90d)</button>
            <button onclick="sendAction('grant_speed')" class="btn btn-primary">⚡ Grant Speed (24h)</button>
          </div>
        </div>

        <div style="margin-bottom:12px;">
          <input type="text" id="adminSearch" class="input-box" placeholder="🔍 Search ID, Owner, Title, or Password..." oninput="filterAdminLinks()">
        </div>

        <div id="adminLinksList"></div>
      `;
      container.innerHTML = adminControls;
      renderAdminCards(items);
    } 
    // 2. USER DASHBOARD (100% FREE & OPEN ACCESS TO PERSONAL FILES)
    else {
      roleBadge.innerText = uRole === "vip" ? "⭐ VIP Member" : "Free User";
      roleBadge.className = uRole === "vip" ? "badge badge-vip" : "badge badge-user";
      summaryCount.innerText = `My Files: ${items.length}`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding: 24px 14px;">
            <p style="font-size:14px; font-weight:600;">No uploaded files found.</p>
            <p style="font-size:12px; color:var(--muted); margin-top:6px;">Send documents, photos, or videos in the Telegram chat to generate your first link!</p>
            <button onclick="closeApp()" class="btn btn-primary" style="margin-top:14px;">📤 Go to Upload Chat</button>
          </div>
        `;
      } else {
        container.innerHTML = items.map(item => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <b style="font-size:13px;">📦 ${escapeHtml(item.t || 'Untitled Package')}</b>
              <span class="badge ${item.p ? 'badge-vip' : 'badge-user'}">${item.p ? 'PERMANENT' : 'EXPIRING'}</span>
            </div>

            <div class="stats-grid">
              <div class="stat-item"><span>Current Password</span><b>${item.k ? '🔑 ' + escapeHtml(item.k) : '🔓 Public'}</b></div>
              <div class="stat-item"><span>Total Views</span><b>👁️ ${item.v || 0}</b></div>
              <div class="stat-item"><span>Files Attached</span><b>📁 ${item.c || 1} file(s)</b></div>
              <div class="stat-item"><span>Link ID</span><b><code>${item.i}</code></b></div>
            </div>

            <div style="background:rgba(0,0,0,0.25); padding:8px; border-radius:8px; margin-top:6px;">
              <div style="display:flex; gap:4px;">
                <input type="text" id="n_${item.i}" class="input-box" style="margin:0;" placeholder="Edit Title" value="${escapeHtml(item.t || '')}">
                <input type="text" id="p_${item.i}" class="input-box" style="margin:0;" placeholder="Edit Password" value="${escapeHtml(item.k || '')}">
              </div>
              <button onclick="updateDetails('${item.i}')" class="btn btn-primary" style="margin-top:6px;">💾 Save Title & Password</button>
            </div>

            <div style="display:flex; gap:6px; margin-top:6px;">
              <a href="https://t.me/FILETOLINKSPRBOT?start=${item.i}" class="btn btn-secondary" target="_blank">🔗 Test Link</a>
              <button onclick="sendAction('delete_link', '${item.i}')" class="btn btn-danger">🗑️ Delete</button>
            </div>
          </div>
        `).join('');
      }
    }

    function renderAdminCards(list) {
      const listDiv = document.getElementById("adminLinksList");
      if (!listDiv) return;

      if (list.length === 0) {
        listDiv.innerHTML = `<div class="card" style="text-align:center; color:var(--muted); font-size:12px;">No links found in database.</div>`;
        return;
      }

      listDiv.innerHTML = list.map(item => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <b style="font-size:13px;">📦 ${escapeHtml(item.t || 'Untitled')}</b>
              <div style="font-size:10px; color:var(--muted);">ID: <code>${item.i}</code></div>
            </div>
            <span class="badge ${item.p ? 'badge-vip' : 'badge-user'}">${item.p ? 'PERMANENT' : 'EXPIRING'}</span>
          </div>

          <div class="stats-grid">
            <div class="stat-item"><span>Owner ID / Username</span><b>${item.u} (${escapeHtml(item.un || 'Unknown')})</b></div>
            <div class="stat-item"><span>Plain Password</span><b>${item.k ? '🔑 ' + escapeHtml(item.k) : '🔓 None'}</b></div>
            <div class="stat-item"><span>Total Views</span><b>👁️ ${item.v || 0}</b></div>
            <div class="stat-item"><span>Files Attached</span><b>📁 ${item.c || 1} file(s)</b></div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:4px; margin-top:6px;">
            <a href="https://t.me/FILETOLINKSPRBOT?start=${item.i}" class="btn btn-primary" target="_blank">🔗 Open</a>
            <button onclick="sendAction('set_permanent', '${item.i}')" class="btn btn-gold">♾️ Lock</button>
            <button onclick="sendAction('delete_link', '${item.i}')" class="btn btn-danger">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    function filterAdminLinks() {
      let q = document.getElementById("adminSearch").value.toLowerCase();
      let filtered = items.filter(r => 
        (r.i && r.i.toLowerCase().includes(q)) ||
        (r.t && r.t.toLowerCase().includes(q)) ||
        (r.un && r.un.toLowerCase().includes(q)) ||
        (String(r.u).includes(q)) ||
        (r.k && r.k.toLowerCase().includes(q))
      );
      renderAdminCards(filtered);
    }

    function sendAction(actionType, linkId = "") {
      let targetId = document.getElementById("targetUserId") ? document.getElementById("targetUserId").value.trim() : "";
      if (tg) {
        tg.sendData(JSON.stringify({ action: actionType, target_id: targetId, link_id: linkId }));
        tg.close();
      }
    }

    function updateDetails(id) {
      let n = document.getElementById(`n_${id}`).value.trim();
      let p = document.getElementById(`p_${id}`).value.trim();
      if (tg) {
        tg.sendData(JSON.stringify({ action: "update_link", link_id: id, nickname: n, password: p }));
        tg.close();
      }
    }

    function closeApp() {
      if (tg) tg.close();
      else window.close();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
